---
- name: Старт домашней работы
  hosts: all
  become: true

  tasks:
    - name: Обновление репозиториев
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Установка необходимых пакетов
      ansible.builtin.apt:
        name:
          - spawn-fcgi
          - php
          - php-cgi
          - php-cli
          - apache2
          - libapache2-mod-fcgid
          - nginx
          - rsyslog
        state: present

    - name: Создание конфигурационного файла
      ansible.builtin.copy:
        dest: /etc/default/watchlog
        owner: root
        group: root
        mode: '0644'
        content: |
          # Конфиг для имитации мониторинга

          # Ключевые триггеры
          KEYWORD="WARNING INFO"
          # Местоположение
          LOG=/var/log/watchlog.log

    - name: Создание файла-лога
      ansible.builtin.copy:
        dest: /var/log/watchlog.log
        owner: root
        group: root
        mode: '0644'
        content: |
          Oh-Oh Otus
          WARNING: Test warning!
          INFO: Test information!
          Oh-Oh Otus

    - name: Создание скрипта мониторинга
      ansible.builtin.copy:
        dest: /opt/watchlog.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash

          WORD="$1"
          LOG="$2"
          DATE=$(date)

          if grep -E "$WORD" "$LOG" >/dev/null 2>&1
          then
              logger "$DATE: Found keyword $WORD in $LOG"
          else
              exit 0
          fi

    - name: Создание системного демона
      ansible.builtin.copy:
        dest: /etc/systemd/system/watchlog.service
        mode: '0644'
        content: |
          [Unit]
          Description=Otus Task N9

          [Service]
          Type=oneshot
          EnvironmentFile=/etc/default/watchlog
          ExecStart=/opt/watchlog.sh "${KEYWORD}" "${LOG}"

    - name: Создание таймера
      ansible.builtin.copy:
        dest: /etc/systemd/system/watchlog.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Run watchlog every 30 seconds

          [Timer]
          OnBootSec=30
          OnUnitActiveSec=30
          Unit=watchlog.service

          [Install]
          WantedBy=timers.target

    - name: Активация rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started

    - name: Активация мониторинга
      ansible.builtin.systemd:
        daemon_reload: true
        name: watchlog.timer
        enabled: true
        state: started

    - name: Создание директории для spawn-fcgi
      ansible.builtin.file:
        path: /etc/spawn-fcgi
        state: directory
        mode: '0755'

    - name: Создание конфигурации для spawn-fcgi
      ansible.builtin.copy:
        dest: /etc/spawn-fcgi/fcgi.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Configuration for spawn-fcgi

          SOCKET=/var/run/php-fcgi.sock
          OPTIONS="-u www-data -g www-data -s $SOCKET -S -M 0600 -C 32 -F 1 -- /usr/bin/php-cgi"

    - name: Создание системного демона spawn-fcgi
      ansible.builtin.copy:
        dest: /etc/systemd/system/spawn-fcgi.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Spawn-fcgi
          After=network.target

          [Service]
          Type=simple
          EnvironmentFile=/etc/spawn-fcgi/fcgi.conf
          ExecStart=/usr/bin/spawn-fcgi -n $OPTIONS
          KillMode=process

          [Install]
          WantedBy=multi-user.target

    - name: Запуск spawn-fcgi
      ansible.builtin.systemd:
        daemon_reload: true
        name: spawn-fcgi
        enabled: true
        state: started

    - name: Остановка текущего демона Nginx
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Создание временного сервиса Nginx
      ansible.builtin.copy:
        dest: /etc/systemd/system/nginx@.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=A high performance web server and reverse proxy
          After=network.target nss-lookup.target

          [Service]
          Type=forking
          PIDFile=/run/nginx-%I.pid

          ExecStartPre=/usr/sbin/nginx -t -c /etc/nginx/nginx-%I.conf -q -g 'daemon on; master_process on;'
          ExecStart=/usr/sbin/nginx -c /etc/nginx/nginx-%I.conf -g 'daemon on; master_process on;'
          ExecReload=/usr/sbin/nginx -c /etc/nginx/nginx-%I.conf -g 'daemon on; master_process on;' -s reload
          ExecStop=-/sbin/start-stop-daemon --quiet --stop --retry QUIT/5 --pidfile /run/nginx-%I.pid

          TimeoutStopSec=5
          KillMode=mixed

          [Install]
          WantedBy=multi-user.target

    - name: Создание первой конфигурации Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/nginx-first.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          user www-data;
          worker_processes auto;

          pid /run/nginx-first.pid;

          events {
              worker_connections 768;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              access_log /var/log/nginx/first-access.log;
              error_log /var/log/nginx/first-error.log;

              sendfile on;
              keepalive_timeout 65;

              server {
                  listen 9001;
                  server_name localhost;

                  root /var/www/html;
                  index index.html index.php;

                  location / {
                      try_files $uri $uri/ =404;
                  }

                  location ~ \.php$ {
                      include fastcgi_params;
                      fastcgi_pass unix:/var/run/php-fcgi.sock;
                      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  }
              }
          }

    - name: Создание второй конфигурации Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/nginx-second.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          user www-data;
          worker_processes auto;

          pid /run/nginx-second.pid;

          events {
              worker_connections 768;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              access_log /var/log/nginx/second-access.log;
              error_log /var/log/nginx/second-error.log;

              sendfile on;
              keepalive_timeout 65;

              server {
                  listen 9002;
                  server_name localhost;

                  root /var/www/html;
                  index index.html index.php;

                  location / {
                      try_files $uri $uri/ =404;
                  }

                  location ~ \.php$ {
                      include fastcgi_params;
                      fastcgi_pass unix:/var/run/php-fcgi.sock;
                      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  }
              }
          }

    - name: Создание псевдосайта
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <html>
          <head>
              <title>I am Nginx</title>
          </head>
          <body>
              <h1>Otus Task N9</h1>
              <p>Nginx OK</p>
          </body>
          </html>

    - name: Перезапуск systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Запуск первого Nginx
      ansible.builtin.systemd:
        name: nginx@first
        enabled: true
        state: started

    - name: Запуск второго Nginx
      ansible.builtin.systemd:
        name: nginx@second
        enabled: true
        state: started

    - name: Проверка мониторинга
      ansible.builtin.command:
        cmd: systemctl status watchlog.timer
      register: watchlog_status
      changed_when: false

    - name: Проверка spawn-fcgi
      ansible.builtin.command:
        cmd: systemctl status spawn-fcgi
      register: fcgi_status
      changed_when: false

    - name: Проверка второго Nginx
      ansible.builtin.command:
        cmd: systemctl status nginx@second
      register: nginx_status
      changed_when: false

    - name: Результаты проверок
      ansible.builtin.debug:
        msg:
          - "watchlog: {{ watchlog_status.stdout_lines[2] | default('running') }}"
          - "spawn-fcgi: {{ fcgi_status.stdout_lines[2] | default('running') }}"
          - "nginx@second: {{ nginx_status.stdout_lines[2] | default('running') }}"

    - name: Проверка прослушиваемых портов
      ansible.builtin.command:
        cmd: ss -tnulp
      register: ports
      changed_when: false

    - name: Список прослушиваемых портов
      ansible.builtin.debug:
        var: ports.stdout_lines
